services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_app

    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel_db
      DB_USERNAME: laravel_user
      DB_PASSWORD: lab_password_123

    depends_on:
      - mysql

    networks:
      - laravel_network

  mysql:
    image: mysql:8.0

    container_name: laravel_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: lab_password_123
      MYSQL_ROOT_PASSWORD: root_lab_password_123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_lab_password_123"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - laravel_network

volumes:
  mysql_data:
    
  

networks:
  laravel_network:
    driver: bridge